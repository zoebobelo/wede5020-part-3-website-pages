<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiries - LEXHAPHOTOGRAPHY</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!--header section with logo and title-->
    <div class="top-section">
        <header class="header">
            <img
        src="lexhaphotography logo 2.png"
        alt="Lexhaphotography logo"
        width="100"
        height="100"
        />
            <h1 id="Title">LEXHAPHOTOGRAPHY</h1>
        </header>

        <button id="menuBtn" type="button" aria-controls="mainNav" aria-expanded="false">
            <span aria-hidden="true">☰</span> Menu
        </button>

        <nav id="mainNav" aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="02-about-us-page.html">About us</a></li>
                <li><a href="03-image-gallery.html">Image Gallery</a></li>
                <li><a href="05-enquiry-page.html" class="active" aria-current="page">Enquiry</a></li>
                <li><a href="04-Contact-page.html">Contact us</a></li>
            </ul>
        </nav>
        <hr id="HeaderLine">
    </div>

    <main class="enquiry-container">
        <h1>Enquiries</h1>
        <p class="subtitle">Please fill out the form below to get in touch with us.</p>

        <form action="mailto:Lexhaphotography@gmail.com" method="post" enctype="text/plain">
            <table>
                <tr>
                    <td><label for="title">Title:</label></td>
                    <td><input type="text" id="title" name="title" required></td>
                </tr>
                <tr>
                    <td><label for="firstname">First Name:</label></td>
                    <td><input type="text" id="firstname" name="firstname" required></td>
                </tr>
                <tr>
                    <td><label for="surname">Surname:</label></td>
                    <td><input type="text" id="surname" name="surname" required></td>
                </tr>
                <tr>
                    <td><label for="email">Email: <span>*</span></label></td>
                    <td><input type="email" id="email" name="email" required></td>
                </tr>
                <tr>
                    <td><label for="phonenumber">Phone Number:</label></td>
                    <td><input type="tel" id="phonenumber" name="phonenumber" pattern="[0-9]{10}" placeholder="e.g 0723142309"></td>
                </tr>
                <tr>
                    <td><label for="message">Message:</label></td>
                    <td><textarea id="message" name="message" rows="4" required></textarea></td>
                </tr>
                <tr>
                    <td><label for="preferredDate">Preferred Date of Shoot:</label></td>
                    <td><input type="date" id="preferredDate" name="preferredDate"></td>
                </tr>
                <tr>
                    <td><label for="preferredLocation">Preferred Location:</label></td>
                    <td><input type="text" id="preferredLocation" name="preferredLocation"></td>
                </tr>
                <tr>
                    <td></td>
                    <td class="buttons">
                        <button type="submit">Submit Form</button>
                        <button type="reset">Clear Form</button>
                    </td>
                </tr>
            </table>
        </form>
    </main>

    <div class="bottom-section">
        <hr id="footerLine">
        <footer class="footer">
            <p>&copy; Lexhaphotography, All rights reserved</p>
            <a href="mailto:st10530562@myemeris.edu.za">Email me at st10530562@myemeris.edu.za</a>
        </footer>
    </div>

    <script src="images/Script.js" defer></script>
</body>
</html>
